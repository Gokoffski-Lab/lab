[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloverwarp"
version = "0.1.0.dev0"
description = "Reconstruct retinal clover flatmounts by registering each petal's vasculature to the eye's in vivo angiogram"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Gokoffski Lab" }]
keywords = ["retina", "flatmount", "registration", "angiography", "RGC"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-image>=0.22",
  "networkx>=3.0",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "tifffile>=2023.7",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
# vendor microscope formats; avoid if you can convert to OME-TIFF upstream
vendor = ["bioio>=1.0", "bioio-lif", "bioio-czi"]
excel = ["openpyxl>=3.1"]
imageio = ["imageio>=2.31"]
dev = ["pytest>=7.4", "pytest-cov", "ruff>=0.5"]

[project.scripts]
cloverwarp = "cloverwarp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 90
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
