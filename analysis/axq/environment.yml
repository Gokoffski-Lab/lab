# conda env create -f environment.yml && conda activate axq
# Update after editing: conda env update -f environment.yml --prune
name: axq
channels:
  - conda-forge
dependencies:
  - python=3.13
  - pip
  # core
  - numpy>=1.26
  - scipy>=1.12
  - scikit-image>=0.22
  - pandas>=2.1
  - tifffile>=2024.1.30
  - roifile>=2024.1.10
  # napari panel
  - napari>=0.5
  - pyqt6>=6.7  # napari >=0.6 needs Qt 6; plain `pyqt` on conda-forge is Qt 5
  - magicgui>=0.8
  # tests
  - pytest>=8
  - pytest-qt  # qtbot fixture for tests/test_napari_widget.py
  - pip:
      # Zeiss .czi reading
      - bioio>=1.0
      - bioio-czi>=1.0
      # axq itself, editable: registers the axq command, napari plugin and axq.tools entry points
      - -e .
