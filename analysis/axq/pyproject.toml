[project]
name = "axq"
version = "0.1.0"
description = "Lab image quantification suite: optic-nerve axon density, with room for RGC counting and other tools"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-image>=0.22",
    "pandas>=2.1",
    "tifffile>=2024.1.30",
    "roifile>=2024.1.10",
]

[project.optional-dependencies]
czi = ["bioio>=1.0", "bioio-czi>=1.0"]
napari = ["napari[pyqt6]>=0.5", "magicgui>=0.8"]
test = ["pytest>=8"]

[project.scripts]
axq = "axq.cli:main"

# Tools register here. A tool in another package declares the same group in its own pyproject.
[project.entry-points."axq.tools"]
axon_density = "axq.tools.axon_density:AxonDensity"

[project.entry-points."napari.manifest"]
axq = "axq.napari_plugin:napari.yaml"

[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/axq"]

[tool.pytest.ini_options]
testpaths = ["tests"]
