name: Bug
description: Something in a script, tool or page is broken
labels: [bug]
body:
  - type: input
    id: where
    attributes:
      label: Which tool or page?
      placeholder: e.g. rbpms-count, PDCT acquisition, docs/workflows/erg-export
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Paste the error message if there is one. Don't attach data files.
    validations:
      required: true
  - type: input
    id: computer
    attributes:
      label: Which computer?
      placeholder: e.g. acquisition PC, analysis PC (GOKOFFSK-DT1), personal Mac
