name: rbpms-count tests

on:
  push:
    branches: [main]
    paths: ["analysis/rbpms-count/**", ".github/workflows/rbpms-count.yml"]
  pull_request:
    paths: ["analysis/rbpms-count/**", ".github/workflows/rbpms-count.yml"]

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analysis/rbpms-count
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
