name: axq tests

on:
  push:
    branches: [main]
    paths: ["analysis/axq/**", ".github/workflows/axq.yml"]
  pull_request:
    paths: ["analysis/axq/**", ".github/workflows/axq.yml"]

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analysis/axq
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[test]"
      - run: pytest -q
