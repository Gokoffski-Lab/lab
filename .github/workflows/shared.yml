name: shared naming tests

on:
  push:
    branches: [main]
    paths: ["shared/**", ".github/workflows/shared.yml"]
  pull_request:
    paths: ["shared/**", ".github/workflows/shared.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest
      - run: cd shared/python && python -m pytest -q
