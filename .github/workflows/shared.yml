name: shared naming tests

on:
  push:
    branches: [main]
    paths: ["shared/**", ".github/workflows/shared.yml"]
  pull_request:
    paths: ["shared/**", ".github/workflows/shared.yml"]

jobs:
  matlab:
    # MATLAB on GitHub Actions is free for public repositories.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: matlab-actions/setup-matlab@v2
      - uses: matlab-actions/run-tests@v2
        with:
          source-folder: shared/matlab
          select-by-folder: shared/matlab/tests

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest
      - run: cd shared/python && python -m pytest -q
