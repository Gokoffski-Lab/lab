[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gokoffski-example"          # rename: gokoffski-<subproject>
version = "0.1.0"
description = "One-line purpose"   # replace
requires-python = ">=3.10"
dependencies = [
  # pin loosely, e.g. "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../../shared/python"]   # adjust depth so shared/python resolves from this folder
